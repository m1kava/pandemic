<section class="hero">
  <div class="hero-main">
    <p class="eyebrow">COVID-19 · მსოფლიო</p>
    <h1 class="hero-title">დადასტურებული შემთხვევები მსოფლიოში</h1>
    <p class="hero-figure" data-hero>&nbsp;</p>
    <p class="hero-meta" data-hero-meta>&nbsp;</p>
  </div>
  <a class="card ge-spot" href="georgia.html" data-ge-spot aria-label="საქართველოს სტატისტიკა">
    <span class="ge-spot-head"><span class="flag" aria-hidden="true">🇬🇪</span> საქართველო</span>
    <span class="ge-spot-body" data-ge-body><span class="skeleton-line"></span><span class="skeleton-line"></span></span>
    <span class="ge-spot-link">დეტალურად →</span>
  </a>
</section>

<div class="kpis" data-kpis aria-live="polite"></div>

<section class="card chart-card" data-timeline aria-label="მსოფლიო ქრონოლოგია"></section>

<section class="section">
  <div class="section-head">
    <h2>რეიტინგი</h2>
    <div class="segmented" role="group" aria-label="მაჩვენებელი" data-rank-metric>
      <button type="button" data-value="cases" aria-pressed="true">შემთხვევები</button>
      <button type="button" data-value="deaths" aria-pressed="false">გარდაცვალება</button>
      <button type="button" data-value="casesPerOneMillion" aria-pressed="false">1 მლნ-ზე</button>
    </div>
  </div>
  <div class="grid-2">
    <section class="card">
      <h3 class="card-title">კონტინენტები</h3>
      <div class="hbars" data-continents></div>
    </section>
    <section class="card">
      <h3 class="card-title">ტოპ 10 ქვეყანა</h3>
      <div class="hbars" data-top></div>
      <a class="card-link" href="global.html">ყველა ქვეყანა →</a>
    </section>
  </div>
</section>

{{tips}}
