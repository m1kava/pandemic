<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Pandemic.Ge</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Vladimer Mikava">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  {{canonical}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} · Pandemic.Ge">
  <meta property="og:description" content="{{description}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/icon.png">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://disease.sh" crossorigin>
  {{preload}}
  <link rel="stylesheet" href="{{css}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <script type="module" src="{{js}}"></script>
</head>
<body data-page="{{page}}">
  <a class="skip" href="#main">გადასვლა შინაარსზე</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Pandemic.Ge — მთავარი">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="7"/><g stroke-width="2.5" stroke-linecap="round"><path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.5 6.5l3.5 3.5M22 22l3.5 3.5M6.5 25.5l3.5-3.5M22 10l3.5-3.5"/></g></svg>
        <span>Pandemic<span class="brand-tld">.Ge</span></span>
      </a>
      <nav class="nav" aria-label="მთავარი მენიუ">{{nav}}</nav>
      <button type="button" class="icon-btn theme-btn" data-theme-toggle aria-label="თემის შეცვლა" title="თემა">
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-brand">Pandemic.Ge</p>
        <p class="muted">COVID-19 სტატისტიკა ქართულად. მონაცემები: <a href="https://disease.sh" rel="noopener">disease.sh</a> (Worldometers, Johns Hopkins CSSE, Our World in Data).</p>
      </div>
      <p class="footer-links">
        <a href="https://www.facebook.com/Pandemic.Ge" rel="noopener">Facebook</a>
        <a href="https://github.com/m1kava/pandemic" rel="noopener">GitHub</a>
        <button type="button" class="link-btn" data-share>გაზიარება</button>
      </p>
      <p class="muted copyright">© {{year}} PANDEMIC.GE</p>
    </div>
  </footer>
</body>
</html>
