name: Deploy to GitHub Pages

# Builds the site and publishes ./dist to the `gh-pages` branch, which
# GitHub Pages serves (Settings -> Pages -> Deploy from a branch -> gh-pages).

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild daily so the bundled data snapshot stays fresh.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check scripts/build.mjs && node --check src/assets/js/app.js

      - name: Build site
        run: node scripts/build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "::notice title=Published::Site pushed to gh-pages -> https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
