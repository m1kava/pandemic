name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild daily so the bundled data snapshot stays fresh.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        # Fails until Pages is enabled in the repo settings; the build itself
        # doesn't need it, so keep going and report it clearly at deploy time.
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Check JavaScript syntax
        run: node --check scripts/build.mjs && node --check src/assets/js/app.js

      - name: Build site
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        if: needs.build.outputs.pages_enabled != 'true'
        run: |
          echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages -> Build and deployment, set Source to 'GitHub Actions', then re-run this workflow."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
